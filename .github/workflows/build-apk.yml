name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Configure Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME"                                          >  android/local.properties
          echo "org.gradle.java.home=$JAVA_HOME"                               >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"          >> android/gradle.properties

      - name: Test JS bundle (surface bundler errors early)
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.java.installations.paths=${{ env.JAVA_HOME }}
            -Dorg.gradle.java.installations.auto-provisioning=false
            -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toric-iol-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
