name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Configure Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME"                                 >  android/local.properties
          echo "org.gradle.java.home=$JAVA_HOME"                      >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "newArchEnabled=false"                                  >> android/gradle.properties
          echo "edgeToEdgeEnabled=false"                              >> android/gradle.properties
          echo "expo.inlineModules.watchedDirectories=[]"             >> android/gradle.properties

      - name: Bundle JavaScript
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false
          ls -lh android/app/src/main/assets/

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace \
            -x createBundleDebugJsAndAssets \
            "-Pexpo.inlineModules.watchedDirectories=[]" \
            > /tmp/gradle.log 2>&1 || {
            echo ""
            echo "====== FIRST 80 LINES ======"
            head -80 /tmp/gradle.log
            echo ""
            echo "====== LAST 120 LINES ======"
            tail -120 /tmp/gradle.log
            echo "============================="
            exit 1
          }
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.java.installations.paths=${{ env.JAVA_HOME }}
            -Dorg.gradle.java.installations.auto-provisioning=false
            -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toric-iol-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 7
