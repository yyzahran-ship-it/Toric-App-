name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/upload.keystore \
            -alias toric \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Toric IOL,O=ToricApp,C=US"
          echo "MYAPP_UPLOAD_STORE_FILE=upload.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=android"     >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=toric"            >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=android"       >> android/gradle.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toric-iol-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
